<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sprintlet</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	<style>
		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;

			&:after, &:before {
				box-sizing: inherit;
			}
		}

		body {
			align-items: center;
			display: flex;
			font-family: 'Inter', sans-serif;
			justify-content: center;
			min-height: 100vh;
			padding: 24px;
		}

		.container {
			border-radius: 12px;
			max-width: 480px;
			padding: 48px 32px;
			text-align: center;
			width: 100%;
		}

		.logo {
			height: auto;
			margin-bottom: 24px;
			max-width: 120px;
			user-select: none;
		}

		h1 {
			font-size: 32px;
			font-weight: 500;
			margin-bottom: 8px;
		}

		p {
			color: #94a3b8;
			font-size: 16px;
			margin-bottom: 24px;
		}
	</style>
</head>
<body>
	<main class="container">
		<img src="https://avatars.githubusercontent.com/u/318541060?s=120&v=4" alt="Sprintlet" class="logo">

		<h1>Sprintlet</h1>
		<p>Smarter sprints. Superior software.</p>
	</main>
</body>
</html>
